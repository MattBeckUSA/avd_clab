---
#This causes AVD to skip the configuration of the management interface and gateway, which is useful for lab environments where these may not be needed or are configured differently.
# Completely disable AVD management interface config
mgmt_interface: Management0
mgmt_gateway: 172.16.100.1
mgmt_ip: null
mgmt_subnet: null
mgmt_ipv4: null
mgmt_interface_vrf: MGMT
# mgmt_interface_vrf: default   # or just omit this line

# This was the original content of dc1.yml before I modified it to skip management interface configuration. The original content is left here for reference in case you want to revert the changes or compare with the new configuration.
